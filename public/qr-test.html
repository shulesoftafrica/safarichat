<!DOCTYPE html>
<html>
<head>
    <title>QR Code Test</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h2>QR Code Generation Test</h2>
    
    <div id="test-results">
        <h3>1. External QR Service Test</h3>
        <img id="external-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=256x256&format=png&data=Test QR Code" alt="External QR" style="border: 1px solid #ccc;">
        
        <h3>2. Local QR Generation Test</h3>
        <div id="local-qr-container">
            <button onclick="testLocalQR()">Test Local QR Generation</button>
            <div id="local-qr-result"></div>
        </div>
    </div>
    
    <script>
        function testLocalQR() {
            // Test if we can access the debug route
            fetch('/debug-qr')
                .then(response => response.json())
                .then(data => {
                    console.log('Debug QR Response:', data);
                    if (data.success) {
                        const img = document.createElement('img');
                        img.src = data.qr_code;
                        img.style.border = '1px solid #ccc';
                        img.style.maxWidth = '256px';
                        document.getElementById('local-qr-result').innerHTML = '';
                        document.getElementById('local-qr-result').appendChild(img);
                    } else {
                        document.getElementById('local-qr-result').innerHTML = '<div style="color: red;">Error: ' + data.error + '</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    document.getElementById('local-qr-result').innerHTML = '<div style="color: red;">Fetch Error: ' + error.message + '</div>';
                });
        }
    </script>
</body>
</html>
