<!DOCTYPE html>
<html>
<head>
    <title>Product Form Test</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .status { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
    </style>
</head>
<body>
    <h2>Product Form JavaScript Tests</h2>
    <div id="results"></div>
    
    <script>
        // Test the essential functions needed for the product form
        const results = document.getElementById('results');
        
        function addResult(test, status, message) {
            const div = document.createElement('div');
            div.className = `status ${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        // Test 1: Check if we can reach the service page
        fetch('/service')
            .then(response => {
                if (response.ok) {
                    addResult('Service Page Access', 'success', 'Service page is accessible');
                    return response.text();
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            })
            .then(html => {
                // Test 2: Check if toggleProductTypeFields function is defined in the page
                if (html.includes('function toggleProductTypeFields()')) {
                    addResult('toggleProductTypeFields Function', 'success', 'Function is defined in the page');
                } else {
                    addResult('toggleProductTypeFields Function', 'error', 'Function not found in page source');
                }
                
                // Test 3: Check if togglePricingFields function is defined
                if (html.includes('function togglePricingFields()')) {
                    addResult('togglePricingFields Function', 'success', 'Function is defined in the page');
                } else {
                    addResult('togglePricingFields Function', 'error', 'Function not found in page source');
                }
                
                // Test 4: Check if duplicate currentProductId exists
                const matches = html.match(/let currentProductId/g);
                if (matches && matches.length > 1) {
                    addResult('Duplicate currentProductId', 'error', `Found ${matches.length} declarations`);
                } else {
                    addResult('Duplicate currentProductId', 'success', 'No duplicate declarations found');
                }
                
                // Test 5: Check for inline onchange handlers
                if (html.includes('onchange="toggleProductTypeFields()"')) {
                    addResult('Inline Event Handlers', 'error', 'Still using inline onchange handlers');
                } else {
                    addResult('Inline Event Handlers', 'success', 'No problematic inline handlers found');
                }
                
                // Test 6: Check essential function availability
                const essentialFunctions = [
                    'addServiceTier', 'removeServiceTier', 'addDocumentUpload', 
                    'removeDocumentType', 'addSellingPoint', 'removeSellingPoint'
                ];
                
                let missingFunctions = [];
                essentialFunctions.forEach(func => {
                    if (!html.includes(`function ${func}(`)) {
                        missingFunctions.push(func);
                    }
                });
                
                if (missingFunctions.length === 0) {
                    addResult('Essential Functions', 'success', 'All essential functions are defined');
                } else {
                    addResult('Essential Functions', 'error', `Missing: ${missingFunctions.join(', ')}`);
                }
            })
            .catch(error => {
                addResult('Service Page Access', 'error', `Failed to access: ${error.message}`);
            });
    </script>
</body>
</html>
