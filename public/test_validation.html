<!DOCTYPE html>
<html>
<head>
    <title>Form Validation Test</title>
    <style>
        body { padding: 20px; font-family: Arial, sans-serif; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        button { margin: 5px; padding: 8px 12px; }
    </style>
</head>
<body>
    <h2>Product Form Validation Test</h2>
    <div id="results"></div>
    
    <h3>Test Actions:</h3>
    <button onclick="testServiceValidation()">Test Service Form Validation</button>
    <button onclick="testProductValidation()">Test Product Form Validation</button>
    <button onclick="testFieldToggling()">Test Field Toggling</button>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(test, status, message) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            div.innerHTML = `<strong>${test}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        function testServiceValidation() {
            clearResults();
            
            // Test that service form doesn't validate hidden pricing fields
            fetch('/service')
                .then(response => response.text())
                .then(html => {
                    // Check if retail_price and wholesale_price have required attribute removed for services
                    if (html.includes('removeAttribute(\'required\')')) {
                        addResult('Service Validation Fix', 'success', 'Code includes logic to remove required attribute from hidden fields');
                    } else {
                        addResult('Service Validation Fix', 'error', 'Required attribute removal logic not found');
                    }
                    
                    // Check if validation function handles visibility
                    if (html.includes('window.getComputedStyle(fieldContainer).display !== \'none\'')) {
                        addResult('Visibility Check', 'success', 'Validation function checks field visibility before validating');
                    } else {
                        addResult('Visibility Check', 'error', 'Validation function does not check field visibility');
                    }
                })
                .catch(error => {
                    addResult('Service Validation Test', 'error', `Failed: ${error.message}`);
                });
        }
        
        function testProductValidation() {
            clearResults();
            
            fetch('/service')
                .then(response => response.text())
                .then(html => {
                    // Check if product validation includes price comparison
                    if (html.includes('wholesalePrice >= retailPrice')) {
                        addResult('Product Price Validation', 'success', 'Product form validates price relationships');
                    } else {
                        addResult('Product Price Validation', 'error', 'Price validation logic not found');
                    }
                    
                    // Check if SKU field is managed properly
                    if (html.includes('setAttribute(\'required\', \'required\')')) {
                        addResult('SKU Field Management', 'success', 'SKU field required attribute is managed dynamically');
                    } else {
                        addResult('SKU Field Management', 'error', 'SKU field management logic not found');
                    }
                })
                .catch(error => {
                    addResult('Product Validation Test', 'error', `Failed: ${error.message}`);
                });
        }
        
        function testFieldToggling() {
            clearResults();
            
            fetch('/service')
                .then(response => response.text())
                .then(html => {
                    // Check if field toggling function exists
                    if (html.includes('function toggleProductTypeFields()')) {
                        addResult('Field Toggling Function', 'success', 'toggleProductTypeFields function is defined');
                    } else {
                        addResult('Field Toggling Function', 'error', 'toggleProductTypeFields function not found');
                    }
                    
                    // Check if sections have proper IDs
                    const sectionsWithIds = [
                        'pricingInventorySection',
                        'aiSalesConfigSection',
                        'productTagsSection',
                        'skuField'
                    ];
                    
                    let missingSections = [];
                    sectionsWithIds.forEach(section => {
                        if (!html.includes(`id="${section}"`)) {
                            missingSections.push(section);
                        }
                    });
                    
                    if (missingSections.length === 0) {
                        addResult('Section IDs', 'success', 'All required sections have proper IDs');
                    } else {
                        addResult('Section IDs', 'error', `Missing IDs: ${missingSections.join(', ')}`);
                    }
                })
                .catch(error => {
                    addResult('Field Toggling Test', 'error', `Failed: ${error.message}`);
                });
        }
        
        // Run initial tests
        window.onload = function() {
            addResult('Form Validation Tests', 'info', 'Click buttons above to run specific tests');
        };
    </script>
</body>
</html>
